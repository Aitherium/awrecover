[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "awrecover"
version = "0.1.0"
description = "Labelled snapshots of a directory, with a restore that either fully lands or does not land at all — and a verify that proves restorability by restoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # HARD, not optional. A snapshot IS an awshare bundle; a recovery tool that
    # degrades to "archiving unavailable" produces records that look like
    # backups and are not.
    "awshare>=0.1.0",
]

[project.optional-dependencies]
seal = ["awseal>=0.1.0"]
# `remote` is opt-in, and the code REFUSES rather than degrading without it:
# a push that silently fell back to plaintext would put a workspace -- users,
# knowledge, secrets -- on a git host in the clear, which is worse than having
# no remote at all. See the module docstring in awrecover/remote.py.
remote = ["cryptography>=41.0"]
dev = ["pytest>=7.0"]

[project.scripts]
awrecover = "awrecover.cli:main"

[project.urls]
Homepage = "https://github.com/Aitherium/awrecover"
Repository = "https://github.com/Aitherium/awrecover.git"

[tool.setuptools]
packages = ["awrecover"]
license-files = ["LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
